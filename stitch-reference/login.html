<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .floating-label-input:focus-within label {
            transform: translateY(-20px) scale(0.85);
            color: #461599;
        }
        .bg-mauve-gradient {
            background: linear-gradient(135deg, #fbf9f9 0%, #ecdeee 100%);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex items-center justify-center p-md overflow-hidden relative">
<!-- Background Layer: High-quality Blurred Restaurant -->
<div class="fixed inset-0 z-0">
<div class="absolute inset-0 bg-mauve-gradient opacity-80 z-10"></div>
<div class="w-full h-full bg-cover bg-center transition-all duration-1000 scale-105" data-alt="A sophisticated high-end restaurant interior captured in a soft, cinematic blur. The scene features warm ambient lighting, elegant table settings with glassware, and rich textures of dark wood and velvet. The color palette is dominated by muted purples, deep plums, and soft off-whites, creating an atmosphere of understated luxury and professional excellence. The lighting is low-key and atmospheric, suggesting a premium dining environment during a quiet evening service." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAUn-J3WBBKHCMehPNsnUiKp-7bXHcHO2WwVCGj-eNzATQCOqDzNI-5TPiQqJspv3RiJBDO5bmgMLsUypw4B7U4v0gQxGnxYMMCjaMBtlHvi78ocO6cM-5tBVEt3xzRA7vz9ttMRNzqRHZz4kFqSgdFvHkjq2ju2tojt4PRFXfo9cehIFkam9SqYe5Xbr_uuffZfxoIGkuoeYtN66uGhEX4upwqxgotsKh6Pv-RknvsvkolVRMMtZRgcQ')"></div>
</div>
<!-- Main Login Container -->
<main class="relative z-20 w-full max-w-[460px] animate-in fade-in slide-in-from-bottom-8 duration-700">
<!-- Logo & Branding Section -->
<div class="flex flex-col items-center mb-xl">
<div class="mb-md">
<span class="font-display text-display text-primary tracking-tight">Tavla</span>
</div>
<div class="h-1 w-12 bg-primary rounded-full mb-md"></div>
<h1 class="font-headline-md text-headline-md text-on-surface text-center px-lg">Restaurant Dashboard Access</h1>
</div>
<!-- Glassmorphic Login Card -->
<div class="glass-panel p-xl rounded-xl shadow-lg">
<!-- Branch Context -->
<div class="mb-lg flex items-center gap-sm bg-secondary-container/30 p-sm rounded-lg border border-outline-variant/30">
<span class="material-symbols-outlined text-primary" data-icon="storefront">storefront</span>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant">Active Branch</span>
<span class="font-label-md text-label-md text-on-surface">Narange Restaurant - Old City Branch</span>
</div>
<button class="ml-auto p-xs hover:bg-surface-variant rounded-full transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]" data-icon="swap_horiz">swap_horiz</span>
</button>
</div>
<form action="#" class="space-y-lg" id="loginForm" method="POST">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-outline" data-icon="mail">mail</span>
<input class="w-full pl-[48px] pr-md py-md bg-surface-container-lowest border border-outline-variant/50 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-outline/50 font-body-md text-body-md" id="email" name="email" placeholder="manager@narange.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-end ml-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline transition-all" href="#">Forgot?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-outline" data-icon="lock">lock</span>
<input class="w-full pl-[48px] pr-[48px] py-md bg-surface-container-lowest border border-outline-variant/50 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-outline/50 font-body-md text-body-md" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-md text-outline hover:text-primary transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Sign In Action -->
<button class="group relative w-full py-md bg-primary text-on-primary rounded-lg font-label-md text-label-md hover:shadow-lg hover:bg-primary-container transition-all active:scale-[0.98] flex items-center justify-center gap-sm overflow-hidden" type="submit">
<span class="relative z-10">Sign In</span>
<span class="material-symbols-outlined relative z-10 transition-transform group-hover:translate-x-1" data-icon="arrow_forward">arrow_forward</span>
<div class="absolute inset-0 bg-white/10 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
</button>
</form>
<!-- Footer Help Text -->
<div class="mt-xl pt-lg border-t border-outline-variant/30 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Authorized access only. By continuing, you agree to the 
                    <a class="text-primary font-medium hover:underline" href="#">Security Protocols</a>.
                </p>
</div>
</div>
<!-- Support Shortcut -->
<div class="mt-lg flex justify-center items-center gap-md">
<button class="flex items-center gap-xs font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[18px]" data-icon="support_agent">support_agent</span>
                Technical Support
            </button>
<div class="w-1 h-1 bg-outline rounded-full"></div>
<button class="flex items-center gap-xs font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[18px]" data-icon="language">language</span>
                English (US)
            </button>
</div>
</main>
<!-- Micro-interactions Script -->
<script>
        // Password Visibility Toggle
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        
        toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            toggleBtn.querySelector('span').textContent = isPassword ? 'visibility_off' : 'visibility';
        });

        // Submit Animation Simulation
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = loginForm.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Verifying...</span>
            `;

            setTimeout(() => {
                btn.innerHTML = `<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span> <span>Access Granted</span>`;
                btn.classList.replace('bg-primary', 'bg-tertiary-container');
                setTimeout(() => {
                    alert('Logging in to Narange Restaurant Dashboard...');
                    btn.innerHTML = originalContent;
                    btn.disabled = false;
                    btn.classList.replace('bg-tertiary-container', 'bg-primary');
                }, 1000);
            }, 1500);
        });
    </script>
</body></html>
